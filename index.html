<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8"> 
    <title>Подорож до Львова</title>

    <style>  
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf7ff;
            text-align: center;
            margin: 0;
            color: #2f4f5f;
        }

        .box {
            background-color: #ffffff;
            width: 70%;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px #b7dff2;
        }

        h1 {
            color: #3b8dbd;
        }

        p {
            color: #355c70;
        }

        img {
            width: 500px;
            border-radius: 12px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            background-color: #7ec8e3;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background-color: #5dade2;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Подорож до Львова</h1>

        <p>
            Львів — це красиве місто з давньою історією, затишними вуличками
            та особливою атмосферою. Тут можна побачити Оперний театр,
            Площу Ринок та багато цікавих місць.
        </p>

        <img src="https://hotel-edem.lviv.ua/wp-content/uploads/2019/07/ukraina-lviv-teatr-opery-i-baletu.jpg" 
             alt="Львівський оперний театр">

        <br>

        <a href="https://lviv.travel/" target="_blank">
            Дізнатися більше про Львів
        </a>
    </div>

</html>
